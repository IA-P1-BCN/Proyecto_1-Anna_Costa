name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (black, isort, flake8)
        run: |
          black --check .
          isort --check-only .
          flake8 .

      - name: Tests (unitarios + integración + e2e)
        run: pytest -v

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias del backend
        run: pip install -r backend/requirements-dev.txt

      - name: Tests del backend (unitarios + integración)
        run: pytest backend/tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Levantar con un único comando
        run: docker compose up -d --build

      - name: Comprobar que la web responde
        run: >
          curl -fsS --retry 15 --retry-delay 2 --retry-connrefused
          http://localhost:5000/ | grep -q "Taxímetro"

      - name: Logs del contenedor si falla
        if: failure()
        run: docker compose logs
