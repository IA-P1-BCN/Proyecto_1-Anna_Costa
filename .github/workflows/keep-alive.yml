name: Keep-alive

# Render (plan gratuito) duerme la API tras 15 min sin tráfico. Este ping la
# mantiene despierta de 08:00 a 24:00 (hora peninsular de verano); de noche se
# deja dormir para no agotar las 750 h/mes de instancia gratuita.
on:
  schedule:
    - cron: "*/5 6-21 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a /health
        run: curl -fsS --retry 3 --max-time 90 https://taximetro-api.onrender.com/health
